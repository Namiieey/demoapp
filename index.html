<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Functional Rehab Lab | Premium Physiotherapy</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --m-black: #090909;
            --d-black: #050505;
            --f-orange: #FF5A00;
            --border: #1f1f1f;
            --gray-text: #a3a3a3;
        }

        * { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        
        body { background-color: var(--m-black); color: white; overflow-x: hidden; }

        /* Minimal Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Glassmorphism & UI Components */
        .glass-card { background: #0f0f0f; border: 1px solid var(--border); border-radius: 20px; }
        .btn-orange { background: var(--f-orange); transition: all 0.2s ease; }
        .btn-orange:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .input-dark { background: #151515; border: 1px solid var(--border); border-radius: 12px; color: white; padding: 12px 16px; width: 100%; transition: border-color 0.2s; }
        .input-dark:focus { border-color: var(--f-orange); outline: none; }
        
        .sidebar-link.active { color: var(--f-orange); background: rgba(255, 90, 0, 0.05); border-right: 2px solid var(--f-orange); }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease forwards; }

        /* Loader */
        #loader { background: var(--m-black); z-index: 9999; }
        
        @media print { .no-print { display: none !important; } .print-only { display: block !important; color: black !important; } }
    </style>
</head>
<body>

    <!-- GLOBAL LOADING STATE -->
    <div id="loader" class="fixed inset-0 flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-2 border-white/10 border-t-[#FF5A00] rounded-full animate-spin mb-4"></div>
        <p class="text-[10px] tracking-[0.4em] uppercase text-gray-500 font-bold">Functional Rehab Lab</p>
    </div>

    <!-- AUTHENTICATION VIEW -->
    <div id="view-auth" class="hidden min-h-screen flex items-center justify-center p-6 bg-[url('https://www.transparenttextures.com/patterns/black-linen.png')]">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-20 h-20 mx-auto rounded-3xl mb-6 shadow-2xl" alt="Logo">
                <h1 class="text-2xl font-extrabold tracking-tight">FUNCTIONAL <span class="text-[#FF5A00]">REHAB LAB</span></h1>
                <p class="text-gray-500 text-sm mt-2">Premium performance & physiotherapy</p>
            </div>

            <div class="glass-card p-8 shadow-2xl border-white/5">
                <div id="auth-title-box" class="mb-8">
                    <h2 class="text-xl font-bold" id="auth-header">Welcome Back</h2>
                    <p class="text-gray-500 text-sm mt-1" id="auth-subheader">Access your recovery dashboard</p>
                </div>

                <form id="auth-form" class="space-y-5">
                    <div id="name-field" class="hidden">
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold mb-2 block">Full Name</label>
                        <input type="text" id="auth-name" class="input-dark" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold mb-2 block">Username</label>
                        <input type="text" id="auth-username" required class="input-dark" placeholder="Enter username">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold mb-2 block">Password</label>
                        <input type="password" id="auth-password" required class="input-dark" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full btn-orange py-4 rounded-xl font-bold text-sm uppercase tracking-widest mt-2">Continue</button>
                </form>

                <div class="mt-8 pt-6 border-t border-white/5 text-center">
                    <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-gray-500 text-xs hover:text-[#FF5A00] transition-colors">
                        New patient? <span class="text-[#FF5A00] font-bold">Create Account</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP VIEW -->
    <div id="view-app" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <!-- Desktop Sidebar -->
        <aside class="hidden md:flex w-72 flex-col bg-[#050505] border-r border-white/5">
            <div class="p-8">
                <div class="flex items-center gap-3 mb-12">
                    <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-10 h-10 rounded-xl">
                    <span class="text-sm font-black tracking-tighter uppercase">Rehab <span class="text-[#FF5A00]">Lab</span></span>
                </div>
                <nav id="nav-desktop" class="space-y-1"></nav>
            </div>
            <div class="mt-auto p-8">
                <button onclick="handleLogout()" class="flex items-center gap-4 text-gray-500 hover:text-white font-bold text-sm transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#090909]">
            <!-- Header -->
            <header class="h-20 border-b border-white/5 px-6 md:px-10 flex items-center justify-between bg-[#090909]/80 backdrop-blur-xl z-20">
                <div class="md:hidden flex items-center gap-3">
                    <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-8 h-8 rounded-lg">
                </div>
                <h2 id="current-view-title" class="text-lg font-bold">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-3 bg-[#111] border border-white/5 py-1.5 px-4 rounded-full">
                        <div id="avatar-circle" class="w-7 h-7 rounded-full bg-[#FF5A00] flex items-center justify-center text-[10px] font-black"></div>
                        <span id="header-user-name" class="text-sm font-medium hidden sm:block"></span>
                    </div>
                </div>
            </header>

            <!-- Scrollable Page Container -->
            <div id="page-content" class="flex-1 overflow-y-auto p-6 md:p-10 pb-32"></div>

            <!-- Mobile Navigation -->
            <nav id="nav-mobile" class="md:hidden fixed bottom-0 left-0 right-0 h-20 bg-[#050505]/95 backdrop-blur-lg border-t border-white/5 flex items-center justify-around px-6 z-50"></nav>
        </main>
    </div>

    <!-- MODAL SYSTEM -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-[#0f0f0f] border border-white/5 rounded-[32px] overflow-hidden max-h-[90vh] flex flex-col relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-500 hover:text-white z-10"><i data-lucide="x"></i></button>
            <div id="modal-body" class="overflow-y-auto p-8 md:p-12"></div>
        </div>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-wrap" class="fixed top-6 left-1/2 -translate-x-1/2 z-[200] flex flex-col items-center pointer-events-none"></div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, onSnapshot, addDoc, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- FIREBASE CONFIGURATION ---
        // Replace with your actual credentials for production
        const firebaseConfig = {
            apiKey: "FIREBASE_API_KEY",
            authDomain: "rehab-lab.firebaseapp.com",
            projectId: "rehab-lab",
            storageBucket: "rehab-lab.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- STATE ---
        let state = {
            user: null,
            role: null,
            view: 'dashboard',
            isLogin: true,
            appointments: [],
            prescriptions: [],
            patients: []
        };

        const ADMINS = {
            "Dr_AnandGR": "dranand@123",
            "Cloudfare": "cloudfare@123"
        };
        const CLINIC_WHATSAPP = "918088596486";
        const internalDomain = "@rehablab.io"; // Used to map usernames to Firebase Auth

        // --- INITIALIZATION ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                const userData = userDoc.data();
                state.user = { ...user, ...userData };
                state.role = userData?.role || 'patient';
                
                document.getElementById('header-user-name').innerText = state.user.name || state.user.displayName;
                document.getElementById('avatar-circle').innerText = (state.user.name || 'U')[0].toUpperCase();
                
                initRealtimeData();
                showView('app');
                navigate('dashboard');
            } else {
                showView('auth');
            }
            hideLoader();
        });

        // --- AUTH LOGIC ---
        const handleAuth = async (e) => {
            e.preventDefault();
            const username = document.getElementById('auth-username').value;
            const pass = document.getElementById('auth-password').value;
            const email = username + internalDomain;
            
            setBtnLoading(true);

            try {
                if (state.isLogin) {
                    // Check local admin mapping first for predefined creds
                    if (ADMINS[username] && ADMINS[username] === pass) {
                        await signInWithEmailAndPassword(auth, email, pass);
                    } else {
                        await signInWithEmailAndPassword(auth, email, pass);
                    }
                } else {
                    const name = document.getElementById('auth-name').value;
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), {
                        uid: res.user.uid,
                        username: username,
                        name: name,
                        role: 'patient',
                        createdAt: new Date().toISOString()
                    });
                }
            } catch (err) {
                showToast(err.message.replace("Firebase: ", ""), "error");
            } finally {
                setBtnLoading(false);
            }
        };

        window.toggleAuthMode = () => {
            state.isLogin = !state.isLogin;
            document.getElementById('auth-header').innerText = state.isLogin ? 'Welcome Back' : 'Create Account';
            document.getElementById('auth-subheader').innerText = state.isLogin ? 'Access your recovery dashboard' : 'Join the Functional Rehab Lab';
            document.getElementById('name-field').classList.toggle('hidden', state.isLogin);
            document.getElementById('auth-toggle-btn').innerHTML = state.isLogin ? 
                'New patient? <span class="text-[#FF5A00] font-bold">Create Account</span>' : 
                'Already have an account? <span class="text-[#FF5A00] font-bold">Login</span>';
        };

        window.handleLogout = () => {
            signOut(auth).then(() => location.reload());
        };

        // --- NAVIGATION ---
        const navSchema = {
            patient: [
                { id: 'dashboard', label: 'Home', icon: 'home' },
                { id: 'book', label: 'Book', icon: 'plus-circle' },
                { id: 'sessions', label: 'Sessions', icon: 'calendar' },
                { id: 'prescriptions', label: 'Medical', icon: 'file-text' }
            ],
            admin: [
                { id: 'dashboard', label: 'Overview', icon: 'layout-grid' },
                { id: 'manage-appts', label: 'Bookings', icon: 'calendar' },
                { id: 'patients', label: 'Patients', icon: 'users' },
                { id: 'manage-presc', label: 'Scripts', icon: 'clipboard' }
            ]
        };

        window.navigate = (viewId) => {
            state.view = viewId;
            const items = navSchema[state.role];
            const current = items.find(i => i.id === viewId);
            document.getElementById('current-view-title').innerText = current.label;
            
            // Sidebar Active UI
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            const activeLink = document.querySelector(`[data-nav="${viewId}"]`);
            if (activeLink) activeLink.classList.add('active');

            renderPage();
        };

        // --- REALTIME DATA ---
        function initRealtimeData() {
            // Appointments
            const qAppts = state.role === 'admin' ? 
                query(collection(db, "appointments"), orderBy("createdAt", "desc")) :
                query(collection(db, "appointments"), where("patientId", "==", state.user.uid), orderBy("createdAt", "desc"));
            
            onSnapshot(qAppts, (snap) => {
                state.appointments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (['dashboard', 'manage-appts', 'sessions'].includes(state.view)) renderPage();
            });

            // Prescriptions
            const qPresc = state.role === 'admin' ?
                query(collection(db, "prescriptions"), orderBy("createdAt", "desc")) :
                query(collection(db, "prescriptions"), where("patientId", "==", state.user.uid), orderBy("createdAt", "desc"));
            
            onSnapshot(qPresc, (snap) => {
                state.prescriptions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (['dashboard', 'prescriptions', 'manage-presc'].includes(state.view)) renderPage();
            });

            // Admin only: Patients list
            if (state.role === 'admin') {
                onSnapshot(collection(db, "users"), (snap) => {
                    state.patients = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => u.role === 'patient');
                });
            }
        }

        // --- PAGE RENDERING ---
        function renderPage() {
            const container = document.getElementById('page-content');
            container.innerHTML = `<div class="animate-fade">${getTemplate(state.view)}</div>`;
            lucide.createIcons();
        }

        function getTemplate(view) {
            const views = {
                // PATIENT
                'dashboard': () => {
                    const upcoming = state.appointments.find(a => a.status !== 'completed' && a.status !== 'cancelled');
                    const recentP = state.prescriptions[0];
                    
                    return `
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <div class="lg:col-span-8 space-y-8">
                                <section class="glass-card p-8 bg-gradient-to-br from-[#111] to-[#090909]">
                                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-6">Upcoming Session</h3>
                                    ${upcoming ? `
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center gap-6">
                                                <div class="w-16 h-16 rounded-2xl bg-[#FF5A00]/10 flex flex-col items-center justify-center text-[#FF5A00]">
                                                    <span class="text-xl font-black">${new Date(upcoming.date).getDate()}</span>
                                                    <span class="text-[9px] font-bold uppercase">${new Date(upcoming.date).toLocaleString('default', { month: 'short' })}</span>
                                                </div>
                                                <div>
                                                    <p class="text-lg font-bold">${upcoming.service}</p>
                                                    <p class="text-sm text-gray-500">${upcoming.time} • Functional Rehab Lab</p>
                                                </div>
                                            </div>
                                            <span class="px-4 py-1 rounded-full border border-white/10 text-[10px] font-bold uppercase text-[#FF5A00] tracking-widest">${upcoming.status}</span>
                                        </div>
                                    ` : `
                                        <div class="text-center py-10 border-2 border-dashed border-white/5 rounded-2xl">
                                            <p class="text-gray-500 text-sm">No scheduled sessions</p>
                                            <button onclick="navigate('book')" class="mt-4 text-[#FF5A00] text-xs font-bold uppercase tracking-widest">Book Now</button>
                                        </div>
                                    `}
                                </section>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="glass-card p-6">
                                        <h4 class="text-xs font-bold text-gray-500 uppercase mb-4">Latest Prescription</h4>
                                        ${recentP ? `
                                            <p class="text-sm font-bold truncate">${recentP.diagnosis}</p>
                                            <p class="text-[10px] text-gray-500 mt-1">Issued ${recentP.date}</p>
                                            <button onclick="viewPrescription('${recentP.id}')" class="mt-4 text-[#FF5A00] text-xs font-bold uppercase">Open Medical Plan</button>
                                        ` : `<p class="text-xs text-gray-500 italic">None available yet.</p>`}
                                    </div>
                                    <div class="glass-card p-6">
                                        <h4 class="text-xs font-bold text-gray-500 uppercase mb-4">Center Status</h4>
                                        <div class="flex items-center gap-3">
                                            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                                            <span class="text-sm font-bold">Open</span>
                                            <span class="text-xs text-gray-500 ml-auto">09:00 - 20:00</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="lg:col-span-4 space-y-6">
                                <div class="glass-card p-6 border-l-4 border-l-[#FF5A00]">
                                    <h4 class="font-bold text-sm mb-2 italic">Tip of the Day</h4>
                                    <p class="text-xs text-gray-400 leading-relaxed">"Dynamic stretching before activity activates motor patterns and reduces ligamentous strain."</p>
                                </div>
                                <button onclick="window.open('https://wa.me/${CLINIC_WHATSAPP}')" class="w-full bg-[#25D366] text-black font-black p-4 rounded-2xl text-xs uppercase tracking-[0.2em] flex items-center justify-center gap-2">
                                    <i data-lucide="message-square" class="w-4 h-4"></i> Contact Lab
                                </button>
                            </div>
                        </div>
                    `;
                },

                'book': () => `
                    <div class="max-w-xl mx-auto glass-card p-8 md:p-12">
                        <h3 class="text-2xl font-black mb-2">Book Session</h3>
                        <p class="text-gray-500 text-sm mb-10">Select your preferred recovery time</p>
                        <form onsubmit="handleBooking(event)" class="space-y-6">
                            <div>
                                <label class="text-[10px] font-black uppercase text-gray-500 tracking-widest mb-2 block">Service Type</label>
                                <select id="b-service" class="input-dark bg-[#151515]">
                                    <option>Physiotherapy Consultation</option>
                                    <option>Sports Injury Rehabilitation</option>
                                    <option>Dry Needling & IASTM</option>
                                    <option>Post-Op Rehab</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[10px] font-black uppercase text-gray-500 tracking-widest mb-2 block">Date</label>
                                    <input type="date" id="b-date" required class="input-dark">
                                </div>
                                <div>
                                    <label class="text-[10px] font-black uppercase text-gray-500 tracking-widest mb-2 block">Time</label>
                                    <select id="b-time" class="input-dark bg-[#151515]">
                                        <option>10:00 AM</option><option>11:30 AM</option>
                                        <option>04:00 PM</option><option>05:30 PM</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="w-full btn-orange py-5 rounded-2xl font-black uppercase tracking-[0.2em] text-xs">Confirm & Pay</button>
                        </form>
                    </div>
                `,

                'sessions': () => `
                    <div class="glass-card overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-white/5 text-[10px] uppercase font-black tracking-widest text-gray-500">
                                <tr><th class="p-6">Date</th><th class="p-6">Service</th><th class="p-6">Status</th><th class="p-6">Action</th></tr>
                            </thead>
                            <tbody class="divide-y divide-white/5 text-sm">
                                ${state.appointments.map(a => `
                                    <tr>
                                        <td class="p-6 font-bold">${a.date}</td>
                                        <td class="p-6 text-gray-400">${a.service}</td>
                                        <td class="p-6"><span class="text-[#FF5A00] text-[10px] uppercase font-bold tracking-tighter">${a.status}</span></td>
                                        <td class="p-6"><button onclick="viewInvoice('${a.id}')" class="text-xs font-bold underline">Invoice</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `,

                'prescriptions': () => `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${state.prescriptions.map(p => `
                            <div class="glass-card p-8">
                                <div class="flex justify-between items-start mb-6">
                                    <h4 class="text-xl font-bold">${p.diagnosis}</h4>
                                    <i data-lucide="file-text" class="text-[#FF5A00] w-6 h-6"></i>
                                </div>
                                <p class="text-xs text-gray-500 mb-6">Issued by Dr. Anand G.R. on ${p.date}</p>
                                <button onclick="viewPrescription('${p.id}')" class="w-full border border-[#FF5A00] text-[#FF5A00] py-3 rounded-xl font-bold text-xs uppercase">View Medical Plan</button>
                            </div>
                        `).join('')}
                    </div>
                `,

                // ADMIN VIEWS
                'manage-appts': () => `
                    <div class="glass-card overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-white/5 text-[10px] uppercase font-black tracking-widest text-gray-500">
                                <tr><th class="p-6">Patient</th><th class="p-6">Date/Time</th><th class="p-6">Status</th><th class="p-6">Update</th></tr>
                            </thead>
                            <tbody class="divide-y divide-white/5 text-sm">
                                ${state.appointments.map(a => `
                                    <tr>
                                        <td class="p-6">
                                            <p class="font-bold">${a.patientName}</p>
                                            <p class="text-[10px] text-gray-500 uppercase">${a.service}</p>
                                        </td>
                                        <td class="p-6 text-gray-400">${a.date}<br>${a.time}</td>
                                        <td class="p-6 uppercase text-[10px] font-bold text-[#FF5A00]">${a.status}</td>
                                        <td class="p-6">
                                            <select onchange="updateApptStatus('${a.id}', this.value)" class="bg-black border border-white/10 rounded px-2 py-1 text-xs">
                                                <option ${a.status === 'pending' ? 'selected' : ''}>pending</option>
                                                <option ${a.status === 'confirmed' ? 'selected' : ''}>confirmed</option>
                                                <option ${a.status === 'completed' ? 'selected' : ''}>completed</option>
                                                <option ${a.status === 'cancelled' ? 'selected' : ''}>cancelled</option>
                                            </select>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `,

                'patients': () => `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${state.patients.map(p => `
                            <div class="glass-card p-6">
                                <div class="flex items-center gap-4 mb-6">
                                    <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center font-bold text-[#FF5A00]">${p.name[0]}</div>
                                    <div><p class="font-bold">${p.name}</p><p class="text-xs text-gray-500">${p.username}</p></div>
                                </div>
                                <div class="space-y-3">
                                    <button onclick="openPrescForm('${p.uid}', '${p.name}')" class="w-full bg-[#FF5A00]/10 text-[#FF5A00] py-2.5 rounded-xl font-bold text-[10px] uppercase tracking-widest">Issue Script</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `
            };
            return views[view] ? views[view]() : views['dashboard']();
        }

        // --- ACTIONS ---
        window.handleBooking = async (e) => {
            e.preventDefault();
            const data = {
                patientId: state.user.uid,
                patientName: state.user.name,
                service: document.getElementById('b-service').value,
                date: document.getElementById('b-date').value,
                time: document.getElementById('b-time').value,
                status: 'pending',
                amount: '₹1200',
                invoiceId: 'INV-' + Math.floor(Math.random()*10000),
                createdAt: new Date().toISOString()
            };

            await addDoc(collection(db, "appointments"), data);
            showToast("Booking request sent!");
            navigate('sessions');
            viewInvoice(data.id, data);
        };

        window.openPrescForm = (uid, name) => {
            const html = `
                <h2 class="text-xl font-bold mb-8">Medical Plan: <span class="text-[#FF5A00]">${name}</span></h2>
                <form id="presc-form" class="space-y-6">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 mb-2 block">Clinical Diagnosis</label>
                        <input id="pr-diag" required class="input-dark">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 mb-2 block">Treatment Protocol / Exercises</label>
                        <textarea id="pr-ex" rows="6" required class="input-dark"></textarea>
                    </div>
                    <button type="submit" class="w-full btn-orange py-4 rounded-xl font-bold text-xs uppercase tracking-widest">Issue & Sync</button>
                </form>
            `;
            openModal(html);
            document.getElementById('presc-form').onsubmit = async (e) => {
                e.preventDefault();
                await addDoc(collection(db, "prescriptions"), {
                    patientId: uid,
                    patientName: name,
                    diagnosis: document.getElementById('pr-diag').value,
                    exercises: document.getElementById('pr-ex').value,
                    date: new Date().toLocaleDateString(),
                    createdAt: new Date().toISOString()
                });
                closeModal();
                showToast("Prescription issued!");
            };
        };

        window.updateApptStatus = async (id, val) => {
            await updateDoc(doc(db, "appointments", id), { status: val });
            showToast(`Appointment ${val}`);
        };

        window.viewInvoice = (id, data = null) => {
            const a = data || state.appointments.find(x => x.id === id);
            const msg = `*FUNCTIONAL REHAB LAB INVOICE*%0A*Inv:* ${a.invoiceId}%0A*Date:* ${a.date}%0A*Total:* ${a.amount}%0A_Status: Confirmed_`;
            
            const html = `
                <div class="print-area">
                    <div class="flex justify-between items-start mb-12">
                        <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-12 h-12 rounded-xl">
                        <div class="text-right"><p class="text-2xl font-black text-[#FF5A00]">INVOICE</p><p class="text-xs text-gray-500">${a.invoiceId}</p></div>
                    </div>
                    <div class="grid grid-cols-2 gap-8 mb-10 pb-10 border-b border-white/5">
                        <div><p class="text-[10px] font-bold text-gray-500 uppercase mb-2">Patient</p><p class="font-bold">${a.patientName}</p></div>
                        <div class="text-right"><p class="text-[10px] font-bold text-gray-500 uppercase mb-2">Service</p><p class="font-bold">${a.service}</p></div>
                    </div>
                    <div class="flex justify-between text-lg font-bold mb-12"><span>Total Amount</span><span class="text-[#FF5A00]">${a.amount}</span></div>
                    <div class="flex gap-4 no-print">
                        <button onclick="window.print()" class="flex-1 bg-white text-black py-4 rounded-xl font-bold text-xs uppercase tracking-widest">Print PDF</button>
                        <a href="https://wa.me/${CLINIC_WHATSAPP}?text=${msg}" target="_blank" class="flex-1 bg-[#25D366] text-black py-4 rounded-xl font-bold text-xs uppercase tracking-widest text-center">WhatsApp</a>
                    </div>
                </div>
            `;
            openModal(html);
        };

        window.viewPrescription = (id) => {
            const p = state.prescriptions.find(x => x.id === id);
            const html = `
                <div class="text-center mb-10">
                    <h2 class="text-2xl font-black text-[#FF5A00]">MEDICAL PLAN</h2>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest">${p.date}</p>
                </div>
                <div class="space-y-8">
                    <div>
                        <label class="text-[10px] font-black text-gray-500 uppercase mb-2 block">Diagnosis</label>
                        <p class="text-lg font-bold text-white">${p.diagnosis}</p>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-gray-500 uppercase mb-2 block">Instructions & Exercises</label>
                        <div class="bg-white/5 p-6 rounded-2xl text-sm text-gray-300 leading-relaxed">${p.exercises.replace(/\n/g, '<br>')}</div>
                    </div>
                </div>
                <div class="mt-12 pt-6 border-t border-white/5 flex justify-between items-center italic text-[10px] text-gray-600">
                    <span>Clinical Lead: Dr. Anand G.R.</span>
                    <span>Functional Rehab Lab</span>
                </div>
            `;
            openModal(html);
        };

        // --- UI HELPERS ---
        function renderNavigation() {
            const items = navSchema[state.role];
            const desktop = document.getElementById('nav-desktop');
            const mobile = document.getElementById('nav-mobile');
            
            const html = items.map(i => `
                <button onclick="navigate('${i.id}')" data-nav="${i.id}" class="sidebar-link w-full flex items-center gap-4 px-4 py-3 rounded-xl text-gray-500 hover:text-white transition-all font-bold text-sm">
                    <i data-lucide="${i.icon}" class="w-5 h-5"></i>
                    <span class="md:block hidden">${i.label}</span>
                </button>
            `).join('');
            
            desktop.innerHTML = html;
            mobile.innerHTML = html;
            lucide.createIcons();
        }

        function showView(v) {
            document.getElementById('view-auth').classList.toggle('hidden', v !== 'auth');
            document.getElementById('view-app').classList.toggle('hidden', v !== 'app');
            if (v === 'app') renderNavigation();
        }

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        function setBtnLoading(isLoading) {
            const btn = document.querySelector('#auth-form button');
            btn.disabled = isLoading;
            btn.innerText = isLoading ? 'AUTHENTICATING...' : 'CONTINUE';
        }

        function openModal(html) {
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
            lucide.createIcons();
        }

        window.closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

        function showToast(msg, type = "success") {
            const wrap = document.getElementById('toast-wrap');
            const t = document.createElement('div');
            t.className = `p-4 px-6 rounded-full bg-[#111] border border-white/5 shadow-2xl flex items-center gap-3 text-xs font-bold uppercase tracking-widest mt-4 animate-fade ${type === 'error' ? 'text-red-500' : 'text-[#FF5A00]'}`;
            t.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-4 h-4"></i> ${msg}`;
            wrap.appendChild(t);
            lucide.createIcons();
            setTimeout(() => t.remove(), 4000);
        }

        document.getElementById('auth-form').onsubmit = handleAuth;

    </script>
</body>
</html>
