<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Functional Rehab Lab | Premium Physiotherapy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --m-black: #090909;
            --d-black: #050505;
            --f-orange: #FF5A00;
            --border: #1f1f1f;
        }

        * { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
        body { background-color: var(--m-black); color: white; overflow-x: hidden; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--m-black); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Premium UI Elements */
        .glass-card { background: #0f0f0f; border: 1px solid var(--border); border-radius: 24px; transition: all 0.3s ease; }
        .btn-primary { background: var(--f-orange); color: white; font-weight: 700; border-radius: 14px; transition: all 0.2s; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 10px 20px rgba(255, 90, 0, 0.2); }
        .btn-primary:disabled { background: #333; cursor: not-allowed; transform: none; }
        
        .input-dark { background: #151515; border: 1px solid var(--border); border-radius: 14px; color: white; padding: 14px 18px; width: 100%; font-size: 14px; }
        .input-dark:focus { border-color: var(--f-orange); outline: none; background: #1a1a1a; }
        
        .nav-link.active { color: var(--f-orange); background: rgba(255, 90, 0, 0.08); border-right: 3px solid var(--f-orange); }
        .nav-link-mobile.active { color: var(--f-orange); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-view { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        #splash { background: var(--m-black); z-index: 9999; transition: opacity 0.5s ease; }
        
        @media print { .no-print { display: none !important; } .print-only { display: block !important; color: black !important; background: white !important; } }
    </style>
</head>
<body>

    <!-- LOADING SPLASH -->
    <div id="splash" class="fixed inset-0 flex flex-col items-center justify-center">
        <div class="w-16 h-16 border-2 border-white/5 border-t-[#FF5A00] rounded-full animate-spin mb-6"></div>
        <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-12 h-12 rounded-xl opacity-50 grayscale">
    </div>

    <!-- AUTH VIEW -->
    <div id="view-auth" class="hidden min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-[#1a110a] via-black to-black">
        <div class="w-full max-w-sm">
            <div class="text-center mb-10">
                <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-20 h-20 mx-auto rounded-3xl mb-6 shadow-2xl border border-white/5">
                <h1 class="text-2xl font-black tracking-tighter uppercase">Functional <span class="text-[#FF5A00]">Rehab Lab</span></h1>
                <p class="text-gray-500 text-xs font-medium tracking-[0.2em] mt-2">PREMIUM CLINIC PORTAL</p>
            </div>

            <div class="glass-card p-8 shadow-2xl">
                <div id="auth-header" class="mb-8">
                    <h2 class="text-xl font-bold">Sign In</h2>
                    <p class="text-gray-500 text-sm">Enter username and password</p>
                </div>

                <form id="auth-form" class="space-y-4">
                    <div id="name-wrap" class="hidden">
                        <input type="text" id="auth-name" class="input-dark" placeholder="Your Full Name">
                    </div>
                    <input type="text" id="auth-user" required class="input-dark" placeholder="Username">
                    <input type="password" id="auth-pass" required class="input-dark" placeholder="Password">
                    <button type="submit" id="auth-btn" class="w-full btn-primary py-4 text-sm uppercase tracking-widest mt-2">Access Portal</button>
                </form>

                <div class="mt-8 pt-6 border-t border-white/5 text-center">
                    <button onclick="toggleAuth()" id="auth-toggle" class="text-gray-500 text-xs font-medium hover:text-[#FF5A00]">
                        New patient? <span class="text-[#FF5A00] font-bold">Register</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- APP VIEW -->
    <div id="view-app" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <!-- Sidebar -->
        <aside class="hidden md:flex w-72 flex-col bg-black border-r border-white/5">
            <div class="p-8">
                <div class="flex items-center gap-3 mb-12">
                    <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-10 h-10 rounded-xl">
                    <span class="text-xs font-black tracking-widest uppercase">Functional <span class="text-[#FF5A00]">Lab</span></span>
                </div>
                <nav id="nav-desktop" class="space-y-2"></nav>
            </div>
            <div class="mt-auto p-8 border-t border-white/5">
                <button onclick="logout()" class="flex items-center gap-4 text-gray-500 hover:text-white font-bold text-xs uppercase tracking-widest transition-all">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Body -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#050505]">
            <header class="h-20 border-b border-white/5 px-6 md:px-10 flex items-center justify-between bg-black/40 backdrop-blur-xl z-20">
                <h2 id="view-title" class="text-sm font-bold uppercase tracking-widest text-gray-400">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-3 bg-white/5 border border-white/5 py-1.5 px-4 rounded-full">
                        <div id="user-avatar" class="w-7 h-7 rounded-full bg-[#FF5A00] flex items-center justify-center text-[10px] font-black text-white"></div>
                        <span id="user-display-name" class="text-xs font-bold hidden sm:block tracking-wide"></span>
                    </div>
                </div>
            </header>

            <div id="content" class="flex-1 overflow-y-auto p-6 md:p-10 pb-32"></div>

            <!-- Mobile Nav -->
            <nav id="nav-mobile" class="md:hidden fixed bottom-0 left-0 right-0 h-20 bg-black/90 backdrop-blur-xl border-t border-white/5 flex items-center justify-around px-6 z-50"></nav>
        </main>
    </div>

    <!-- MODALS -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-[#0a0a0a] border border-white/5 rounded-[32px] overflow-hidden max-h-[90vh] flex flex-col relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-gray-500 hover:text-white z-10"><i data-lucide="x"></i></button>
            <div id="modal-body" class="overflow-y-auto p-8 md:p-12"></div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-8 left-1/2 -translate-x-1/2 z-[200] pointer-events-none"></div>

    <!-- APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, onSnapshot, addDoc, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- FIREBASE CONFIG ---
        // If these are empty/invalid, the app will automatically switch to "Local Cloud Mode"
        const firebaseConfig = {
            apiKey: "OPTIONAL_KEY",
            authDomain: "functional-rehab.firebaseapp.com",
            projectId: "functional-rehab",
            storageBucket: "functional-rehab.appspot.com",
            messagingSenderId: "000000000",
            appId: "000000000"
        };

        const ADMIN_CREDENTIALS = {
            "Dr_AnandGR": "dranand@123",
            "Cloudfare": "cloudfare@123"
        };
        const CLINIC_WHATSAPP = "918088596486";

        let db, auth, isCloud = false;
        let state = { user: null, role: null, view: 'dash', isLogin: true, appts: [], presc: [], patients: [] };

        // Initialize Firebase with fallback
        try {
            if (firebaseConfig.apiKey !== "OPTIONAL_KEY") {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isCloud = true;
            }
        } catch (e) { console.warn("Firebase Init Failed. Using Local Cloud."); }

        // --- AUTH FLOW ---
        const handleAuth = async (e) => {
            e.preventDefault();
            const user = document.getElementById('auth-user').value;
            const pass = document.getElementById('auth-pass').value;
            const btn = document.getElementById('auth-btn');
            
            btn.disabled = true;
            btn.innerText = "AUTHENTICATING...";

            // Check Admin logic
            if (ADMIN_CREDENTIALS[user] && ADMIN_CREDENTIALS[user] === pass) {
                loginInternal({ uid: 'admin-' + user, name: user === 'Dr_AnandGR' ? 'Dr. Anand G.R.' : 'Admin Cloudfare', role: 'admin', username: user });
                return;
            }

            if (isCloud) {
                try {
                    const email = `${user}@rehablab.local`;
                    if (state.isLogin) {
                        const res = await signInWithEmailAndPassword(auth, email, pass);
                        const docSnap = await getDoc(doc(db, "users", res.user.uid));
                        loginInternal({ ...res.user, ...docSnap.data() });
                    } else {
                        const name = document.getElementById('auth-name').value;
                        const res = await createUserWithEmailAndPassword(auth, email, pass);
                        const userData = { uid: res.user.uid, name, username: user, role: 'patient', createdAt: new Date().toISOString() };
                        await setDoc(doc(db, "users", res.user.uid), userData);
                        loginInternal(userData);
                    }
                } catch (err) {
                    showToast(err.message.split('/')[1]?.replace(')', '') || "Auth Error", "error");
                    btn.disabled = false;
                    btn.innerText = "ACCESS PORTAL";
                }
            } else {
                // Local Auth Fallback
                const localUsers = JSON.parse(localStorage.getItem('f_rehab_users') || '[]');
                if (state.isLogin) {
                    const found = localUsers.find(u => u.username === user && u.password === pass);
                    if (found) loginInternal(found);
                    else { showToast("Invalid credentials", "error"); btn.disabled = false; btn.innerText = "ACCESS PORTAL"; }
                } else {
                    const name = document.getElementById('auth-name').value;
                    const newUser = { uid: 'u-' + Date.now(), name, username: user, password: pass, role: 'patient' };
                    localUsers.push(newUser);
                    localStorage.setItem('f_rehab_users', JSON.stringify(localUsers));
                    loginInternal(newUser);
                }
            }
        };

        function loginInternal(userData) {
            state.user = userData;
            state.role = userData.role;
            localStorage.setItem('f_rehab_session', JSON.stringify(userData));
            
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-app').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = state.user.name;
            document.getElementById('user-avatar').innerText = state.user.name[0].toUpperCase();
            
            initData();
            renderNav();
            navigate('dash');
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
        }

        window.logout = () => { localStorage.removeItem('f_rehab_session'); location.reload(); };

        window.toggleAuth = () => {
            state.isLogin = !state.isLogin;
            document.getElementById('auth-header').innerHTML = state.isLogin ? `<h2 class="text-xl font-bold">Sign In</h2><p class="text-gray-500 text-sm">Enter credentials</p>` : `<h2 class="text-xl font-bold">Register</h2><p class="text-gray-500 text-sm">Create patient profile</p>`;
            document.getElementById('name-wrap').classList.toggle('hidden', state.isLogin);
            document.getElementById('auth-toggle').innerHTML = state.isLogin ? `New patient? <span class="text-[#FF5A00] font-bold">Register</span>` : `Already a user? <span class="text-[#FF5A00] font-bold">Sign In</span>`;
        };

        // --- DATA HUB ---
        function initData() {
            if (isCloud) {
                const qAppts = state.role === 'admin' ? collection(db, "appointments") : query(collection(db, "appointments"), where("patientId", "==", state.user.uid));
                onSnapshot(qAppts, snap => {
                    state.appts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (state.view === 'dash' || state.view === 'sessions') renderPage();
                });

                const qPresc = state.role === 'admin' ? collection(db, "prescriptions") : query(collection(db, "prescriptions"), where("patientId", "==", state.user.uid));
                onSnapshot(qPresc, snap => {
                    state.presc = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (state.view === 'medical') renderPage();
                });
            } else {
                // Local Data Simulation
                state.appts = JSON.parse(localStorage.getItem('f_rehab_appts') || '[]');
                state.presc = JSON.parse(localStorage.getItem('f_rehab_presc') || '[]');
                state.patients = JSON.parse(localStorage.getItem('f_rehab_users') || '[]');
                renderPage();
            }
        }

        // --- NAVIGATION ---
        const navs = {
            patient: [ { id: 'dash', label: 'Home', icon: 'home' }, { id: 'book', label: 'Book', icon: 'plus-circle' }, { id: 'sessions', label: 'History', icon: 'calendar' }, { id: 'medical', label: 'Plans', icon: 'file-text' } ],
            admin: [ { id: 'dash', label: 'Overview', icon: 'activity' }, { id: 'manage-appts', label: 'Bookings', icon: 'calendar' }, { id: 'patients', label: 'Patients', icon: 'users' } ]
        };

        window.navigate = (id) => {
            state.view = id;
            document.getElementById('view-title').innerText = id.replace('-', ' ');
            document.querySelectorAll('.nav-link, .nav-link-mobile').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`[data-nav="${id}"]`).forEach(el => el.classList.add('active'));
            renderPage();
        };

        function renderNav() {
            const items = navs[state.role];
            const dNav = document.getElementById('nav-desktop');
            const mNav = document.getElementById('nav-mobile');
            
            const html = items.map(i => `
                <button onclick="navigate('${i.id}')" data-nav="${i.id}" class="nav-link w-full flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-white transition-all font-bold text-xs uppercase tracking-widest">
                    <i data-lucide="${i.icon}" class="w-4 h-4"></i> ${i.label}
                </button>
            `).join('');

            const mobileHtml = items.map(i => `
                <button onclick="navigate('${i.id}')" data-nav="${i.id}" class="nav-link-mobile flex flex-col items-center gap-1 text-gray-500">
                    <i data-lucide="${i.icon}" class="w-5 h-5"></i>
                </button>
            `).join('');

            dNav.innerHTML = html;
            mNav.innerHTML = mobileHtml;
            lucide.createIcons();
        }

        // --- VIEW TEMPLATES ---
        function renderPage() {
            const container = document.getElementById('content');
            container.innerHTML = `<div class="animate-view">${getTemplate(state.view)}</div>`;
            lucide.createIcons();
        }

        function getTemplate(v) {
            if (v === 'dash') {
                if (state.role === 'admin') {
                    return `
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                            <div class="glass-card p-6">
                                <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Total Patients</p>
                                <p class="text-3xl font-black">${isCloud ? '...' : state.patients.length}</p>
                            </div>
                            <div class="glass-card p-6">
                                <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Appointments</p>
                                <p class="text-3xl font-black">${state.appts.length}</p>
                            </div>
                            <div class="glass-card p-6 border-l-4 border-l-[#FF5A00]">
                                <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Pending</p>
                                <p class="text-3xl font-black text-[#FF5A00]">${state.appts.filter(a=>a.status==='pending').length}</p>
                            </div>
                            <div class="glass-card p-6">
                                <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Completed</p>
                                <p class="text-3xl font-black">${state.appts.filter(a=>a.status==='completed').length}</p>
                            </div>
                        </div>
                        <div class="glass-card p-8">
                            <h3 class="font-bold mb-6 flex items-center gap-2 text-sm uppercase tracking-widest"><i data-lucide="zap" class="w-4 h-4 text-[#FF5A00]"></i> Recent Activity</h3>
                            <div class="space-y-4">
                                ${state.appts.slice(0,5).map(a => `
                                    <div class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                                        <div><p class="text-sm font-bold">${a.patientName}</p><p class="text-[10px] text-gray-500 uppercase">${a.service}</p></div>
                                        <span class="text-[10px] font-black text-[#FF5A00] uppercase">${a.status}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    const upcoming = state.appts.find(a => a.status === 'confirmed' || a.status === 'pending');
                    return `
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 space-y-8">
                                <div class="glass-card p-8 bg-gradient-to-br from-[#111] to-black">
                                    <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-8">Next Session</h3>
                                    ${upcoming ? `
                                        <div class="flex items-center gap-6">
                                            <div class="w-16 h-16 rounded-2xl bg-[#FF5A00]/10 flex flex-col items-center justify-center text-[#FF5A00]">
                                                <span class="text-2xl font-black">${new Date(upcoming.date).getDate()}</span>
                                                <span class="text-[10px] font-black uppercase">${new Date(upcoming.date).toLocaleString('default', {month:'short'})}</span>
                                            </div>
                                            <div>
                                                <p class="text-xl font-black">${upcoming.service}</p>
                                                <p class="text-sm text-gray-500">${upcoming.time} • Functional Rehab Lab</p>
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="py-10 text-center border-2 border-dashed border-white/5 rounded-3xl">
                                            <p class="text-gray-500 text-sm font-medium">No sessions scheduled.</p>
                                            <button onclick="navigate('book')" class="mt-4 text-[#FF5A00] text-xs font-bold uppercase tracking-widest">Book Therapy</button>
                                        </div>
                                    `}
                                </div>
                                <div class="grid grid-cols-2 gap-6">
                                    <div class="glass-card p-6">
                                        <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3">Sessions Done</p>
                                        <p class="text-3xl font-black">${state.appts.filter(a=>a.status==='completed').length}</p>
                                    </div>
                                    <div class="glass-card p-6">
                                        <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3">Clinical Plans</p>
                                        <p class="text-3xl font-black">${state.presc.length}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="space-y-6">
                                <div class="glass-card p-6 border-l-4 border-l-[#FF5A00]">
                                    <p class="text-xs font-bold italic text-gray-400">"Your recovery is our performance benchmark. Stay consistent."</p>
                                </div>
                                <button onclick="window.open('https://wa.me/${CLINIC_WHATSAPP}')" class="w-full bg-[#25D366] text-black font-black p-5 rounded-2xl text-[10px] uppercase tracking-widest flex items-center justify-center gap-3">
                                    <i data-lucide="message-circle" class="w-4 h-4"></i> Support Chat
                                </button>
                            </div>
                        </div>
                    `;
                }
            }

            if (v === 'book') {
                return `
                    <div class="max-w-xl mx-auto glass-card p-8 md:p-12">
                        <h3 class="text-2xl font-black mb-10 text-center">Schedule Session</h3>
                        <form onsubmit="handleBook(event)" class="space-y-6">
                            <select id="b-service" class="input-dark">
                                <option>Physiotherapy Consultation</option>
                                <option>Sports Injury Rehab</option>
                                <option>Performance Recovery</option>
                                <option>Dry Needling Session</option>
                            </select>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="date" id="b-date" required class="input-dark">
                                <select id="b-time" class="input-dark">
                                    <option>10:00 AM</option><option>11:30 AM</option>
                                    <option>04:00 PM</option><option>05:30 PM</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full btn-primary py-5 text-[10px] tracking-[0.3em] uppercase">Confirm Booking</button>
                        </form>
                    </div>
                `;
            }

            if (v === 'manage-appts') {
                return `
                    <div class="glass-card overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-white/5 text-[10px] font-black uppercase tracking-widest text-gray-500">
                                <tr><th class="p-6">Patient</th><th class="p-6">Details</th><th class="p-6">Status</th><th class="p-6">Action</th></tr>
                            </thead>
                            <tbody class="divide-y divide-white/5">
                                ${state.appts.map(a => `
                                    <tr class="text-sm">
                                        <td class="p-6 font-bold">${a.patientName}</td>
                                        <td class="p-6 text-gray-400">${a.date} at ${a.time}</td>
                                        <td class="p-6"><span class="text-[10px] font-black text-[#FF5A00] uppercase">${a.status}</span></td>
                                        <td class="p-6">
                                            <select onchange="updateStatus('${a.id}', this.value)" class="bg-black border border-white/10 text-xs p-2 rounded-lg">
                                                <option ${a.status==='pending'?'selected':''}>pending</option>
                                                <option ${a.status==='confirmed'?'selected':''}>confirmed</option>
                                                <option ${a.status==='completed'?'selected':''}>completed</option>
                                                <option ${a.status==='cancelled'?'selected':''}>cancelled</option>
                                            </select>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            if (v === 'sessions') {
                return `
                    <div class="grid grid-cols-1 gap-4">
                        ${state.appts.map(a => `
                            <div class="glass-card p-6 flex justify-between items-center">
                                <div><p class="font-black">${a.service}</p><p class="text-xs text-gray-500">${a.date} • ${a.time}</p></div>
                                <button onclick="viewInvoice('${a.id}')" class="text-[10px] font-black uppercase text-[#FF5A00] tracking-widest">Invoice</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (v === 'medical') {
                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${state.presc.map(p => `
                            <div class="glass-card p-8">
                                <div class="flex justify-between items-start mb-6">
                                    <h4 class="text-lg font-black">${p.diagnosis}</h4>
                                    <i data-lucide="file-text" class="text-[#FF5A00] w-5 h-5"></i>
                                </div>
                                <p class="text-xs text-gray-500 mb-8">Issued by Dr. Anand G.R. • ${p.date}</p>
                                <button onclick="viewPrescription('${p.id}')" class="w-full border border-white/10 hover:border-[#FF5A00] py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">View Plan</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (v === 'patients') {
                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${state.patients.map(p => `
                            <div class="glass-card p-8">
                                <div class="flex items-center gap-4 mb-6">
                                    <div class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center font-black text-[#FF5A00]">${p.name[0]}</div>
                                    <div><p class="font-black tracking-tight">${p.name}</p><p class="text-[10px] text-gray-500 uppercase tracking-widest">@${p.username}</p></div>
                                </div>
                                <button onclick="openPrescForm('${p.uid}', '${p.name}')" class="w-full bg-[#FF5A00]/10 text-[#FF5A00] py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Create Script</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        // --- HANDLERS ---
        window.handleBook = async (e) => {
            e.preventDefault();
            const data = {
                id: 'A-' + Date.now(), patientId: state.user.uid, patientName: state.user.name,
                service: document.getElementById('b-service').value, date: document.getElementById('b-date').value,
                time: document.getElementById('b-time').value, status: 'pending', amount: '₹1200',
                invoiceId: 'INV-' + Math.floor(Math.random()*10000), createdAt: new Date().toISOString()
            };
            if (isCloud) await addDoc(collection(db, "appointments"), data);
            else {
                const list = JSON.parse(localStorage.getItem('f_rehab_appts') || '[]');
                list.push(data);
                localStorage.setItem('f_rehab_appts', JSON.stringify(list));
                initData();
            }
            showToast("Booking Successful");
            navigate('sessions');
        };

        window.updateStatus = async (id, val) => {
            if (isCloud) await updateDoc(doc(db, "appointments", id), { status: val });
            else {
                const list = JSON.parse(localStorage.getItem('f_rehab_appts') || '[]');
                const idx = list.findIndex(a => a.id === id);
                if (idx > -1) { list[idx].status = val; localStorage.setItem('f_rehab_appts', JSON.stringify(list)); }
                initData();
            }
            showToast("Status Updated");
        };

        window.openPrescForm = (uid, name) => {
            const html = `
                <h2 class="text-xl font-black mb-8 uppercase tracking-widest">Clinical Script: <span class="text-[#FF5A00]">${name}</span></h2>
                <form id="p-form" class="space-y-6">
                    <input id="pr-diag" required class="input-dark" placeholder="Diagnosis (e.g. Lumbar Herniation)">
                    <textarea id="pr-ex" rows="6" required class="input-dark" placeholder="Treatment & Exercises..."></textarea>
                    <button type="submit" class="w-full btn-primary py-4 text-[10px] tracking-widest uppercase">Issue Prescription</button>
                </form>
            `;
            openModal(html);
            document.getElementById('p-form').onsubmit = async (e) => {
                e.preventDefault();
                const pData = { patientId: uid, patientName: name, diagnosis: document.getElementById('pr-diag').value, exercises: document.getElementById('pr-ex').value, date: new Date().toLocaleDateString(), createdAt: new Date().toISOString() };
                if (isCloud) await addDoc(collection(db, "prescriptions"), pData);
                else {
                    const list = JSON.parse(localStorage.getItem('f_rehab_presc') || '[]');
                    list.push(pData);
                    localStorage.setItem('f_rehab_presc', JSON.stringify(list));
                    initData();
                }
                closeModal();
                showToast("Prescription Issued");
            };
        };

        window.viewInvoice = (id) => {
            const a = state.appts.find(x => x.id === id);
            const msg = `*FUNCTIONAL REHAB LAB INVOICE*%0A*ID:* ${a.invoiceId}%0A*Date:* ${a.date}%0A*Patient:* ${a.patientName}%0A*Total:* ${a.amount}`;
            const html = `
                <div class="print-only">
                    <div class="flex justify-between items-center mb-12">
                        <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-14 h-14 rounded-2xl">
                        <div class="text-right"><p class="text-3xl font-black text-[#FF5A00]">INVOICE</p><p class="text-xs text-gray-500 uppercase tracking-widest">${a.invoiceId}</p></div>
                    </div>
                    <div class="grid grid-cols-2 gap-8 py-10 border-y border-white/5 mb-10">
                        <div><p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">To Patient</p><p class="font-bold">${a.patientName}</p></div>
                        <div class="text-right"><p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Centre Contact</p><p class="font-bold">+91 80885 96486</p></div>
                    </div>
                    <div class="flex justify-between items-center text-xl font-black mb-12"><span>Treatment Fee</span><span class="text-[#FF5A00]">${a.amount}</span></div>
                    <div class="flex gap-4 no-print">
                        <button onclick="window.print()" class="flex-1 bg-white text-black py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest">Download PDF</button>
                        <a href="https://wa.me/${CLINIC_WHATSAPP}?text=${msg}" target="_blank" class="flex-1 bg-[#25D366] text-black py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest text-center">WhatsApp</a>
                    </div>
                </div>
            `;
            openModal(html);
        };

        window.viewPrescription = (id) => {
            const p = state.presc.find(x => x.id === id);
            const html = `
                <div class="text-center mb-12">
                    <h2 class="text-3xl font-black text-[#FF5A00] uppercase tracking-widest">Clinical Plan</h2>
                    <p class="text-[10px] text-gray-500 mt-2 uppercase tracking-[0.4em]">Functional Rehab Lab</p>
                </div>
                <div class="space-y-8">
                    <div><p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Diagnosis</p><p class="text-lg font-bold">${p.diagnosis}</p></div>
                    <div><p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Protocol</p><div class="bg-white/5 p-8 rounded-[32px] text-sm text-gray-300 leading-relaxed">${p.exercises.replace(/\n/g, '<br>')}</div></div>
                </div>
                <div class="mt-12 pt-8 border-t border-white/5 flex justify-between items-center italic text-[10px] text-gray-500"><span>Clinical Lead: Dr. Anand G.R.</span><span>Date: ${p.date}</span></div>
            `;
            openModal(html);
        };

        // --- UI HELPERS ---
        function showToast(msg, type="success") {
            const cont = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `p-4 px-6 rounded-full bg-[#111] border border-white/10 shadow-2xl flex items-center gap-3 text-[10px] font-black uppercase tracking-widest mb-3 animate-view ${type==='error'?'text-red-500':'text-[#FF5A00]'}`;
            t.innerHTML = `<i data-lucide="${type==='error'?'alert-circle':'check-circle'}" class="w-4 h-4"></i> ${msg}`;
            cont.appendChild(t);
            lucide.createIcons();
            setTimeout(() => t.remove(), 3000);
        }

        function openModal(html) { document.getElementById('modal-body').innerHTML = html; document.getElementById('modal-overlay').classList.remove('hidden'); document.getElementById('modal-overlay').classList.add('flex'); lucide.createIcons(); }
        window.closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

        // Init App
        const saved = localStorage.getItem('f_rehab_session');
        if (saved) loginInternal(JSON.parse(saved));
        else {
            document.getElementById('view-auth').classList.remove('hidden');
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
        }
        document.getElementById('auth-form').onsubmit = handleAuth;

    </script>
</body>
</html>
