<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Rehab Lab | Premium Physiotherapy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --m-black: #090909;
            --d-black: #050505;
            --f-orange: #FF5A00;
            --b-orange: #FF6A00;
            --gray: #A3A3A3;
            --border: #242424;
        }

        body {
            font-family: 'Plus+Jakarta+Sans', sans-serif;
            background-color: var(--m-black);
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
        }

        .orange-glow { box-shadow: 0 0 20px rgba(255, 90, 0, 0.15); }
        .glass { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(12px); border: 1px solid var(--border); }
        .bg-matte { background-color: var(--m-black); }
        .text-orange { color: var(--f-orange); }
        .bg-orange { background-color: var(--f-orange); }
        
        input, select, textarea {
            background: #151515 !important;
            border: 1px solid var(--border) !important;
            color: white !important;
            border-radius: 12px !important;
        }

        input:focus { border-color: var(--f-orange) !important; outline: none; }

        .btn-primary {
            background-color: var(--f-orange);
            color: white;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover {
            background-color: var(--b-orange);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 90, 0, 0.2);
        }

        .sidebar-item.active {
            background: linear-gradient(90deg, rgba(255, 90, 0, 0.1) 0%, transparent 100%);
            border-left: 4px solid var(--f-orange);
            color: white;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; color: black !important; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-[#1a100a] via-black to-black">
        <div class="w-full max-w-[1000px] grid md:grid-cols-2 glass rounded-[32px] overflow-hidden shadow-2xl">
            <!-- Brand Panel -->
            <div class="hidden md:flex flex-col justify-between p-12 bg-gradient-to-br from-[#0a0a0a] to-black border-r border-[#242424]">
                <div>
                    <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-20 h-20 rounded-2xl mb-8" alt="Logo">
                    <h1 class="text-4xl font-extrabold leading-tight tracking-tighter">FUNCTIONAL<br><span class="text-orange">REHAB LAB</span></h1>
                    <p class="text-gray-400 mt-6 max-w-xs text-lg">Elite physiotherapy and performance recovery center.</p>
                </div>
                <div class="flex items-center gap-4 text-gray-500">
                    <div class="w-12 h-[1px] bg-gray-800"></div>
                    <span class="text-xs uppercase tracking-[0.3em]">Premium Care</span>
                </div>
            </div>

            <!-- Form Panel -->
            <div class="p-8 md:p-16 flex flex-col justify-center">
                <div id="login-view">
                    <h2 class="text-3xl font-bold mb-2">Portal Access</h2>
                    <p class="text-gray-500 mb-10">Enter your credentials to continue</p>
                    <form id="login-form" class="space-y-6">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Username</label>
                            <input type="text" id="login-username" required class="w-full px-5 py-4 focus:ring-1 ring-[#FF5A00]/50" placeholder="Username">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Password</label>
                            <input type="password" id="login-password" required class="w-full px-5 py-4 focus:ring-1 ring-[#FF5A00]/50" placeholder="••••••••">
                        </div>
                        <button type="submit" class="w-full btn-primary py-4 rounded-xl text-lg">Sign In</button>
                    </form>
                    <p class="mt-8 text-center text-gray-500">
                        New patient? <a href="javascript:void(0)" onclick="toggleAuth(false)" class="text-orange font-bold">Register Profile</a>
                    </p>
                </div>

                <div id="signup-view" class="hidden">
                    <h2 class="text-3xl font-bold mb-2">Create Profile</h2>
                    <p class="text-gray-500 mb-8">Register for digital recovery tracking</p>
                    <form id="signup-form" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="reg-fullname" placeholder="Full Name" required class="w-full px-4 py-3">
                            <input type="text" id="reg-username" placeholder="Username" required class="w-full px-4 py-3">
                        </div>
                        <input type="tel" id="reg-phone" placeholder="Phone Number" required class="w-full px-4 py-3">
                        <input type="password" id="reg-password" placeholder="Password" required class="w-full px-4 py-3">
                        <button type="submit" class="w-full btn-primary py-4 rounded-xl">Create Account</button>
                    </form>
                    <p class="mt-8 text-center text-gray-500">
                        Already have access? <a href="javascript:void(0)" onclick="toggleAuth(true)" class="text-orange font-bold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APPLICATION UI -->
    <div id="main-app" class="hidden min-h-screen flex flex-col md:flex-row overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="hidden md:flex w-72 flex-col bg-black border-r border-[#242424]">
            <div class="p-8">
                <div class="flex items-center gap-3 mb-12">
                    <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-10 h-10 rounded-lg">
                    <span class="font-black text-sm tracking-tighter uppercase">Rehab <span class="text-orange">Lab</span></span>
                </div>
                <nav class="space-y-2" id="sidebar-nav">
                    <!-- Nav items injected by JS -->
                </nav>
            </div>
            <div class="mt-auto p-8 border-t border-[#242424]">
                <button onclick="logout()" class="flex items-center gap-4 text-gray-500 hover:text-white transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span class="font-bold">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#050505]">
            <!-- Header -->
            <header class="h-20 border-b border-[#242424] px-6 md:px-10 flex items-center justify-between bg-black/50 backdrop-blur-md z-10">
                <div class="flex items-center gap-4 md:hidden">
                    <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-8 h-8 rounded">
                </div>
                <h2 id="view-title" class="text-xl font-bold">Dashboard</h2>
                <div class="flex items-center gap-6">
                    <div class="relative hidden sm:block">
                        <i data-lucide="bell" class="w-6 h-6 text-gray-500 cursor-pointer hover:text-orange transition-colors"></i>
                        <span class="absolute -top-1 -right-1 w-2 h-2 bg-orange rounded-full"></span>
                    </div>
                    <div class="flex items-center gap-3 bg-[#151515] py-2 px-4 rounded-full border border-[#242424]">
                        <span id="user-initials" class="w-8 h-8 rounded-full bg-orange flex items-center justify-center text-xs font-black text-white"></span>
                        <span id="user-name" class="text-sm font-bold hidden md:block"></span>
                    </div>
                    <button onclick="logout()" class="md:hidden text-gray-500"><i data-lucide="log-out" class="w-6 h-6"></i></button>
                </div>
            </header>

            <!-- Scrollable Body -->
            <div id="content-area" class="flex-1 overflow-y-auto p-6 md:p-10 pb-24">
                <!-- Views are dynamically injected here -->
            </div>

            <!-- Mobile Bottom Nav -->
            <nav id="mobile-nav" class="md:hidden fixed bottom-0 left-0 right-0 h-16 glass border-t border-[#242424] flex items-center justify-around z-50">
                <!-- Mobile icons injected by JS -->
            </nav>
        </main>
    </div>

    <!-- MODAL SYSTEM -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div id="modal-content" class="w-full max-w-2xl bg-[#0a0a0a] border border-[#242424] rounded-[24px] max-h-[90vh] overflow-y-auto p-8 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-500 hover:text-white"><i data-lucide="x"></i></button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container" class="fixed bottom-20 md:bottom-10 right-6 z-[200]"></div>

    <script>
        // --- DATA STATE (Local Persistence Simulation) ---
        const DB = {
            get: (key) => JSON.parse(localStorage.getItem(`rehab_lab_${key}`)) || [],
            set: (key, val) => localStorage.setItem(`rehab_lab_${key}`, JSON.stringify(val)),
            
            admins: [
                { username: 'Dr_AnandGR', password: 'dranand@123', name: 'Dr. Anand G.R.', role: 'admin' },
                { username: 'Cloudfare', password: 'cloudfare@123', name: 'Admin Cloudfare', role: 'admin' }
            ]
        };

        let currentUser = null;
        const CLINIC_WHATSAPP = "918088596486";

        // --- CORE ENGINE ---
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
            lucide.createIcons();
        });

        function initAuth() {
            const saved = localStorage.getItem('rehab_lab_session');
            if (saved) {
                currentUser = JSON.parse(saved);
                showApp();
            }
        }

        function toggleAuth(isLogin) {
            document.getElementById('login-view').classList.toggle('hidden', !isLogin);
            document.getElementById('signup-view').classList.toggle('hidden', isLogin);
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const userVal = document.getElementById('login-username').value;
            const passVal = document.getElementById('login-password').value;

            // Check Admins
            const admin = DB.admins.find(a => a.username === userVal && a.password === passVal);
            if (admin) {
                loginSuccess(admin);
                return;
            }

            // Check Patients
            const patients = DB.get('patients');
            const patient = patients.find(p => p.username === userVal && p.password === passVal);
            if (patient) {
                loginSuccess({ ...patient, role: 'patient' });
                return;
            }

            showToast("Invalid credentials", "error");
        });

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const newUser = {
                id: 'P-' + Date.now(),
                name: document.getElementById('reg-fullname').value,
                username: document.getElementById('reg-username').value,
                phone: document.getElementById('reg-phone').value,
                password: document.getElementById('reg-password').value,
                registeredAt: new Date().toISOString()
            };

            const patients = DB.get('patients');
            if (patients.find(p => p.username === newUser.username)) {
                return showToast("Username already taken", "error");
            }

            patients.push(newUser);
            DB.set('patients', patients);
            loginSuccess({ ...newUser, role: 'patient' });
        });

        function loginSuccess(user) {
            currentUser = user;
            localStorage.setItem('rehab_lab_session', JSON.stringify(user));
            showApp();
            showToast(`Welcome, ${user.name}`);
        }

        function logout() {
            localStorage.removeItem('rehab_lab_session');
            location.reload();
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-name').innerText = currentUser.name;
            document.getElementById('user-initials').innerText = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase();
            
            renderNav();
            navigate(currentUser.role === 'admin' ? 'admin_dashboard' : 'patient_dashboard');
        }

        // --- NAVIGATION SYSTEM ---
        const navItems = {
            patient: [
                { id: 'patient_dashboard', label: 'Dashboard', icon: 'home' },
                { id: 'patient_book', label: 'Book Therapy', icon: 'plus-circle' },
                { id: 'patient_appts', label: 'My Sessions', icon: 'calendar' },
                { id: 'patient_presc', label: 'Prescriptions', icon: 'clipboard' }
            ],
            admin: [
                { id: 'admin_dashboard', label: 'Overview', icon: 'layout-dashboard' },
                { id: 'admin_appts', label: 'Appointments', icon: 'calendar-days' },
                { id: 'admin_patients', label: 'Patient List', icon: 'users' },
                { id: 'admin_presc', label: 'Medical Plans', icon: 'file-text' }
            ]
        };

        function renderNav() {
            const side = document.getElementById('sidebar-nav');
            const mobile = document.getElementById('mobile-nav');
            const items = navItems[currentUser.role];

            side.innerHTML = items.map(item => `
                <button onclick="navigate('${item.id}')" id="nav-${item.id}" class="sidebar-item w-full flex items-center gap-4 px-6 py-4 rounded-xl text-gray-400 hover:text-white transition-all font-semibold">
                    <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');

            mobile.innerHTML = items.map(item => `
                <button onclick="navigate('${item.id}')" id="mnav-${item.id}" class="flex flex-col items-center gap-1 text-gray-500">
                    <i data-lucide="${item.icon}" class="w-6 h-6"></i>
                </button>
            `).join('');

            lucide.createIcons();
        }

        function navigate(viewId) {
            // Update UI Active States
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('[id^="mnav-"]').forEach(el => el.classList.remove('text-orange'));
            
            const sideBtn = document.getElementById(`nav-${viewId}`);
            if (sideBtn) sideBtn.classList.add('active');
            
            const mobBtn = document.getElementById(`mnav-${viewId}`);
            if (mobBtn) mobBtn.classList.add('text-orange');

            // Set Header
            const currentItem = navItems[currentUser.role].find(i => i.id === viewId);
            document.getElementById('view-title').innerText = currentItem.label;

            renderView(viewId);
        }

        // --- VIEW RENDERING ---
        function renderView(viewId) {
            const container = document.getElementById('content-area');
            
            const views = {
                // PATIENT VIEWS
                patient_dashboard: () => {
                    const appts = DB.get('appointments').filter(a => a.patientId === currentUser.id);
                    const upcoming = appts.find(a => a.status === 'confirmed');
                    
                    return `
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 space-y-8">
                                <div class="glass p-8 rounded-[24px] bg-gradient-to-br from-[#151515] to-black">
                                    <div class="flex justify-between items-start mb-6">
                                        <h3 class="text-xl font-bold">Upcoming Session</h3>
                                        <i data-lucide="clock" class="text-orange"></i>
                                    </div>
                                    ${upcoming ? `
                                        <div class="flex items-center gap-6">
                                            <div class="bg-orange/10 p-4 rounded-2xl text-center min-w-[80px]">
                                                <span class="block text-2xl font-black text-orange">${new Date(upcoming.date).getDate()}</span>
                                                <span class="text-[10px] uppercase font-bold text-gray-500">${new Date(upcoming.date).toLocaleString('default', { month: 'short' })}</span>
                                            </div>
                                            <div>
                                                <p class="text-lg font-bold">${upcoming.service}</p>
                                                <p class="text-gray-400 text-sm">${upcoming.time} • Dr. Anand G.R.</p>
                                            </div>
                                        </div>
                                    ` : `<p class="text-gray-500 italic">No confirmed appointments scheduled.</p>`}
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="glass p-6 rounded-2xl">
                                        <div class="flex items-center gap-4 mb-4">
                                            <div class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-500">
                                                <i data-lucide="activity" class="w-5 h-5"></i>
                                            </div>
                                            <h4 class="font-bold">Recovery Path</h4>
                                        </div>
                                        <div class="w-full bg-[#222] h-2 rounded-full overflow-hidden">
                                            <div class="bg-blue-500 h-full w-[65%]"></div>
                                        </div>
                                        <p class="text-xs text-gray-500 mt-3 font-medium">Stage 3: Advanced Mobility</p>
                                    </div>
                                    <div class="glass p-6 rounded-2xl">
                                        <div class="flex items-center gap-4 mb-4">
                                            <div class="w-10 h-10 rounded-full bg-green-500/10 flex items-center justify-center text-green-500">
                                                <i data-lucide="check-circle" class="w-5 h-5"></i>
                                            </div>
                                            <h4 class="font-bold">Latest Plan</h4>
                                        </div>
                                        <p class="text-sm text-gray-400 mb-4">Functional Mobility & Spine Decompression</p>
                                        <button onclick="navigate('patient_presc')" class="text-orange text-xs font-bold uppercase tracking-wider">Open Medical Plan</button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="glass p-8 rounded-[24px]">
                                <h3 class="font-bold mb-6">Quick Actions</h3>
                                <div class="space-y-4">
                                    <button onclick="navigate('patient_book')" class="w-full py-4 bg-[#111] hover:bg-[#1a1a1a] border border-[#242424] rounded-xl flex items-center px-6 gap-4 transition-colors">
                                        <i data-lucide="plus" class="w-5 h-5 text-orange"></i>
                                        <span class="font-bold text-sm">Book New Session</span>
                                    </button>
                                    <a href="https://wa.me/${CLINIC_WHATSAPP}" target="_blank" class="w-full py-4 bg-[#111] hover:bg-[#1a1a1a] border border-[#242424] rounded-xl flex items-center px-6 gap-4 transition-colors">
                                        <i data-lucide="message-circle" class="w-5 h-5 text-green-500"></i>
                                        <span class="font-bold text-sm">Contact Clinic</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                },

                patient_book: () => `
                    <div class="max-w-3xl mx-auto">
                        <div class="glass rounded-[32px] overflow-hidden">
                            <div class="p-8 bg-gradient-to-r from-orange/20 to-transparent border-b border-[#242424]">
                                <h3 class="text-2xl font-bold">Schedule Appointment</h3>
                                <p class="text-gray-400">Choose a recovery session that fits your schedule</p>
                            </div>
                            <form id="booking-form" class="p-8 space-y-8" onsubmit="handleBooking(event)">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div class="space-y-4">
                                        <label class="block text-xs font-bold uppercase tracking-widest text-gray-500">Treatment Category</label>
                                        <select id="book-service" class="w-full p-4 bg-[#0a0a0a]">
                                            <option>Physiotherapy Consultation</option>
                                            <option>Sports Injury Rehabilitation</option>
                                            <option>Post-Op Functional Recovery</option>
                                            <option>Performance Optimization</option>
                                        </select>
                                    </div>
                                    <div class="space-y-4">
                                        <label class="block text-xs font-bold uppercase tracking-widest text-gray-500">Select Specialist</label>
                                        <select class="w-full p-4 bg-[#0a0a0a]">
                                            <option>Dr. Anand G.R. (Clinical Lead)</option>
                                        </select>
                                    </div>
                                    <div class="space-y-4">
                                        <label class="block text-xs font-bold uppercase tracking-widest text-gray-500">Date</label>
                                        <input type="date" id="book-date" required class="w-full p-4">
                                    </div>
                                    <div class="space-y-4">
                                        <label class="block text-xs font-bold uppercase tracking-widest text-gray-500">Time Slot</label>
                                        <select id="book-time" class="w-full p-4 bg-[#0a0a0a]">
                                            <option>09:00 AM</option><option>10:30 AM</option><option>12:00 PM</option>
                                            <option>04:00 PM</option><option>05:30 PM</option><option>07:00 PM</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="w-full btn-primary py-5 rounded-2xl text-lg uppercase tracking-widest font-black">Confirm & Generate Invoice</button>
                            </form>
                        </div>
                    </div>
                `,

                patient_appts: () => {
                    const appts = DB.get('appointments').filter(a => a.patientId === currentUser.id);
                    return `
                        <div class="glass rounded-2xl overflow-hidden">
                            <table class="w-full text-left">
                                <thead class="bg-[#111] text-xs uppercase tracking-widest text-gray-500">
                                    <tr>
                                        <th class="px-8 py-5">Date / Time</th>
                                        <th class="px-8 py-5">Service</th>
                                        <th class="px-8 py-5">Status</th>
                                        <th class="px-8 py-5 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-[#242424]">
                                    ${appts.length ? appts.map(a => `
                                        <tr>
                                            <td class="px-8 py-6">
                                                <p class="font-bold">${a.date}</p>
                                                <p class="text-xs text-gray-500">${a.time}</p>
                                            </td>
                                            <td class="px-8 py-6 text-sm">${a.service}</td>
                                            <td class="px-8 py-6">
                                                <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${
                                                    a.status === 'confirmed' ? 'bg-green-500/10 text-green-500' : 'bg-orange/10 text-orange'
                                                }">${a.status}</span>
                                            </td>
                                            <td class="px-8 py-6 text-right">
                                                <button onclick="viewInvoice('${a.id}')" class="text-xs font-bold text-orange">View Invoice</button>
                                            </td>
                                        </tr>
                                    `).join('') : `<tr><td colspan="4" class="p-10 text-center text-gray-500 italic">No session history found.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    `;
                },

                patient_presc: () => {
                    const prescriptions = DB.get('prescriptions').filter(p => p.patientId === currentUser.id);
                    return `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${prescriptions.length ? prescriptions.map(p => `
                                <div class="glass p-8 rounded-3xl relative overflow-hidden group">
                                    <div class="absolute top-0 right-0 p-4 opacity-10">
                                        <i data-lucide="file-text" class="w-20 h-20 text-orange"></i>
                                    </div>
                                    <div class="mb-6">
                                        <p class="text-xs font-bold text-orange uppercase tracking-widest mb-1">Prescription Date: ${p.date}</p>
                                        <h3 class="text-xl font-bold">${p.diagnosis}</h3>
                                    </div>
                                    <div class="space-y-4 mb-8">
                                        <div>
                                            <p class="text-[10px] uppercase font-bold text-gray-500 tracking-wider">Main Exercises</p>
                                            <p class="text-sm">${p.exercises}</p>
                                        </div>
                                    </div>
                                    <button onclick="viewPrescription('${p.id}')" class="w-full py-3 bg-white text-black font-bold rounded-xl text-sm">Download Clinical Report</button>
                                </div>
                            `).join('') : `<div class="col-span-2 glass p-12 rounded-3xl text-center text-gray-500 italic">Your medical plans will appear here after your first consultation.</div>`}
                        </div>
                    `;
                },

                // ADMIN VIEWS
                admin_dashboard: () => {
                    const pts = DB.get('patients');
                    const appts = DB.get('appointments');
                    const stats = [
                        { label: 'Total Patients', val: pts.length, icon: 'users', color: 'blue' },
                        { label: 'Today Session', val: appts.filter(a => a.date === new Date().toISOString().split('T')[0]).length, icon: 'activity', color: 'orange' },
                        { label: 'Pending Bookings', val: appts.filter(a => a.status === 'pending').length, icon: 'clock', color: 'yellow' },
                        { label: 'Revenue (Est.)', val: '₹' + (appts.length * 1200).toLocaleString(), icon: 'trending-up', color: 'green' }
                    ];

                    return `
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                            ${stats.map(s => `
                                <div class="glass p-6 rounded-2xl relative overflow-hidden">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">${s.label}</p>
                                            <p class="text-3xl font-black mt-2">${s.val}</p>
                                        </div>
                                        <i data-lucide="${s.icon}" class="w-5 h-5 text-orange"></i>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div class="glass rounded-2xl p-8">
                                <h3 class="text-lg font-bold mb-6">Recent Appointments</h3>
                                <div class="space-y-4">
                                    ${appts.slice(-5).reverse().map(a => `
                                        <div class="flex items-center justify-between p-4 bg-[#0d0d0d] rounded-xl border border-[#242424]">
                                            <div>
                                                <p class="font-bold text-sm">${a.patientName}</p>
                                                <p class="text-[10px] text-gray-500 uppercase tracking-wider">${a.service}</p>
                                            </div>
                                            <span class="text-xs font-bold ${a.status === 'confirmed' ? 'text-green-500' : 'text-orange'}">${a.status}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="glass rounded-2xl p-8">
                                <h3 class="text-lg font-bold mb-6">Clinic Capacity</h3>
                                <div class="h-48 flex items-center justify-center text-gray-700">
                                    <p class="text-sm font-medium italic">Peak performance analytics loading...</p>
                                </div>
                            </div>
                        </div>
                    `;
                },

                admin_appts: () => {
                    const appts = DB.get('appointments');
                    return `
                        <div class="glass rounded-2xl overflow-hidden">
                            <table class="w-full text-left">
                                <thead class="bg-[#111] text-xs uppercase tracking-widest text-gray-500">
                                    <tr>
                                        <th class="px-8 py-5">Patient</th>
                                        <th class="px-8 py-5">Date/Time</th>
                                        <th class="px-8 py-5">Service</th>
                                        <th class="px-8 py-5">Status</th>
                                        <th class="px-8 py-5 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-[#242424]">
                                    ${appts.length ? appts.map(a => `
                                        <tr class="hover:bg-white/[0.02] transition-colors">
                                            <td class="px-8 py-6 font-bold text-sm">${a.patientName}</td>
                                            <td class="px-8 py-6 text-xs text-gray-400">${a.date}<br>${a.time}</td>
                                            <td class="px-8 py-6 text-xs text-gray-400">${a.service}</td>
                                            <td class="px-8 py-6">
                                                <select onchange="updateApptStatus('${a.id}', this.value)" class="bg-[#111] border border-[#333] text-[10px] font-bold p-2 rounded">
                                                    <option ${a.status === 'pending' ? 'selected' : ''}>pending</option>
                                                    <option ${a.status === 'confirmed' ? 'selected' : ''}>confirmed</option>
                                                    <option ${a.status === 'completed' ? 'selected' : ''}>completed</option>
                                                    <option ${a.status === 'cancelled' ? 'selected' : ''}>cancelled</option>
                                                </select>
                                            </td>
                                            <td class="px-8 py-6 text-right">
                                                <button onclick="viewInvoice('${a.id}')" class="p-2 text-gray-500 hover:text-orange"><i data-lucide="eye" class="w-4 h-4"></i></button>
                                            </td>
                                        </tr>
                                    `).join('') : `<tr><td colspan="5" class="p-20 text-center text-gray-500">No appointments recorded.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    `;
                },

                admin_patients: () => {
                    const pts = DB.get('patients');
                    return `
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${pts.map(p => `
                                <div class="glass p-8 rounded-3xl">
                                    <div class="flex items-center gap-4 mb-6">
                                        <div class="w-12 h-12 rounded-full bg-orange/10 flex items-center justify-center text-orange font-black">${p.name[0]}</div>
                                        <div>
                                            <h3 class="font-bold">${p.name}</h3>
                                            <p class="text-xs text-gray-500">${p.phone}</p>
                                        </div>
                                    </div>
                                    <div class="flex flex-col gap-3">
                                        <button onclick="showPrescriptionForm('${p.id}', '${p.name}')" class="w-full py-3 bg-orange/10 text-orange font-bold text-xs uppercase tracking-widest rounded-xl hover:bg-orange hover:text-white transition-all">New Prescription</button>
                                        <button onclick="viewPatientDetails('${p.id}')" class="w-full py-3 bg-[#111] text-gray-400 font-bold text-xs uppercase tracking-widest rounded-xl border border-[#242424]">View History</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                },

                admin_presc: () => {
                    const presc = DB.get('prescriptions');
                    return `
                         <div class="glass rounded-2xl overflow-hidden">
                            <table class="w-full text-left">
                                <thead class="bg-[#111] text-xs uppercase tracking-widest text-gray-500">
                                    <tr>
                                        <th class="px-8 py-5">Patient</th>
                                        <th class="px-8 py-5">Diagnosis</th>
                                        <th class="px-8 py-5">Date</th>
                                        <th class="px-8 py-5 text-right">View</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-[#242424]">
                                    ${presc.reverse().map(p => `
                                        <tr>
                                            <td class="px-8 py-6 font-bold text-sm">${p.patientName}</td>
                                            <td class="px-8 py-6 text-sm text-gray-400">${p.diagnosis}</td>
                                            <td class="px-8 py-6 text-sm text-gray-400">${p.date}</td>
                                            <td class="px-8 py-6 text-right">
                                                <button onclick="viewPrescription('${p.id}')" class="text-orange"><i data-lucide="external-link" class="w-5 h-5"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }
            };

            container.innerHTML = views[viewId] ? views[viewId]() : `<div class="p-20 text-center">Development in Progress</div>`;
            lucide.createIcons();
        }

        // --- HANDLERS & MODALS ---
        function handleBooking(e) {
            e.preventDefault();
            const newAppt = {
                id: 'INV-' + Math.floor(1000 + Math.random() * 9000),
                patientId: currentUser.id,
                patientName: currentUser.name,
                patientPhone: currentUser.phone,
                service: document.getElementById('book-service').value,
                date: document.getElementById('book-date').value,
                time: document.getElementById('book-time').value,
                status: 'pending',
                amount: '1,200',
                createdAt: new Date().toISOString()
            };

            const appts = DB.get('appointments');
            appts.push(newAppt);
            DB.set('appointments', appts);

            viewInvoice(newAppt.id);
            showToast("Appointment Requested!");
        }

        function viewInvoice(id) {
            const a = DB.get('appointments').find(x => x.id === id);
            const msg = `*INVOICE: FUNCTIONAL REHAB LAB*%0A*ID:* ${a.id}%0A*Patient:* ${a.patientName}%0A*Session:* ${a.service}%0A*Date:* ${a.date} at ${a.time}%0A*Total:* ₹${a.amount}%0A_Status: ${a.status.toUpperCase()}_`;
            
            const html = `
                <div class="print-area">
                    <div class="flex justify-between items-start mb-10">
                        <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-16 h-16 rounded-xl">
                        <div class="text-right">
                            <h3 class="text-xl font-black text-orange">INVOICE</h3>
                            <p class="text-xs text-gray-500">#${a.id}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-8 mb-10 border-y border-[#242424] py-8">
                        <div>
                            <p class="text-[10px] uppercase font-black text-gray-500 tracking-widest mb-2">Patient</p>
                            <p class="font-bold">${a.patientName}</p>
                            <p class="text-sm text-gray-400">${a.patientPhone}</p>
                        </div>
                        <div>
                            <p class="text-[10px] uppercase font-black text-gray-500 tracking-widest mb-2">Centre</p>
                            <p class="font-bold text-sm">Functional Rehab Lab</p>
                            <p class="text-[10px] text-gray-500">+91 80885 96486</p>
                        </div>
                    </div>
                    <div class="space-y-4 mb-10">
                        <div class="flex justify-between p-4 bg-white/5 rounded-xl">
                            <span class="text-sm">${a.service}</span>
                            <span class="font-bold text-sm">₹${a.amount}</span>
                        </div>
                    </div>
                    <div class="flex gap-4 no-print">
                        <button onclick="window.print()" class="flex-1 py-4 bg-white text-black font-black text-xs uppercase tracking-widest rounded-xl">Download PDF</button>
                        <a href="https://wa.me/${CLINIC_WHATSAPP}?text=${msg}" target="_blank" class="flex-1 py-4 bg-[#25D366] text-white font-black text-xs uppercase tracking-widest rounded-xl text-center">WhatsApp Now</a>
                    </div>
                </div>
            `;
            openModal(html);
        }

        function showPrescriptionForm(pid, pname) {
            const html = `
                <h3 class="text-2xl font-bold mb-6">New Medical Plan: <span class="text-orange">${pname}</span></h3>
                <form onsubmit="handlePrescriptionSubmit(event, '${pid}', '${pname}')" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Clinical Diagnosis</label>
                        <input id="p-diagnosis" required class="w-full p-4" placeholder="e.g. Lumbar Disc Bulge with Sciatica">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Treatment Strategy & Exercises</label>
                        <textarea id="p-exercises" rows="5" required class="w-full p-4" placeholder="1. Neural Flossing... 2. Cat-Camel..."></textarea>
                    </div>
                    <button type="submit" class="w-full btn-primary py-4 rounded-xl">Save & Issue Prescription</button>
                </form>
            `;
            openModal(html);
        }

        function handlePrescriptionSubmit(e, pid, pname) {
            e.preventDefault();
            const newP = {
                id: 'RX-' + Date.now(),
                patientId: pid,
                patientName: pname,
                diagnosis: document.getElementById('p-diagnosis').value,
                exercises: document.getElementById('p-exercises').value,
                date: new Date().toLocaleDateString(),
                createdAt: new Date().toISOString()
            };

            const all = DB.get('prescriptions');
            all.push(newP);
            DB.set('prescriptions', all);
            
            closeModal();
            showToast("Prescription issued to " + pname);
            navigate('admin_presc');
        }

        function viewPrescription(id) {
            const p = DB.get('prescriptions').find(x => x.id === id);
            const html = `
                <div class="text-center mb-8">
                    <img src="https://plain-apac-prod-public.komododecks.com/202609/17/Kw2mXJAzBAz9GQSJUTXp/image.jpg" class="w-12 h-12 mx-auto rounded-lg mb-4">
                    <h2 class="text-lg font-black tracking-widest">FUNCTIONAL REHAB LAB</h2>
                    <p class="text-[10px] text-gray-500 uppercase">Advanced Physiotherapy Prescription</p>
                </div>
                <div class="border-t border-[#242424] pt-6 mb-8">
                    <p class="text-[10px] font-bold text-orange uppercase tracking-widest mb-1">Patient Name</p>
                    <p class="text-xl font-bold mb-4">${p.patientName}</p>
                    <p class="text-[10px] font-bold text-orange uppercase tracking-widest mb-1">Clinical Diagnosis</p>
                    <p class="text-lg font-medium mb-6">${p.diagnosis}</p>
                    <p class="text-[10px] font-bold text-orange uppercase tracking-widest mb-1">Prescribed Exercises</p>
                    <div class="bg-white/5 p-6 rounded-2xl text-sm leading-relaxed">${p.exercises.replace(/\n/g, '<br>')}</div>
                </div>
                <div class="flex justify-between items-end mt-12">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase">Date Issued</p>
                        <p class="font-bold">${p.date}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-gray-500 uppercase">Physiotherapist</p>
                        <p class="font-bold">Dr. Anand G.R.</p>
                    </div>
                </div>
            `;
            openModal(html);
        }

        function updateApptStatus(id, newStatus) {
            const appts = DB.get('appointments');
            const idx = appts.findIndex(a => a.id === id);
            if (idx > -1) {
                appts[idx].status = newStatus;
                DB.set('appointments', appts);
                showToast("Status updated to " + newStatus);
            }
        }

        // --- HELPERS ---
        function openModal(html) {
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function showToast(msg, type = "success") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 mb-4 rounded-2xl glass flex items-center gap-3 animate-bounce shadow-2xl ${type === 'error' ? 'border-red-500 text-red-500' : 'border-orange text-white'}`;
            toast.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check'}" class="w-5 h-5"></i> <span class="text-sm font-bold">${msg}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.remove(), 4000);
        }
    </script>
</body>
</html>
